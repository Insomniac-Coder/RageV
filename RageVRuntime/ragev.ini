# RageV runtime configuration.
#
# Sits beside a shipped game so it can be configured without a rebuild.
# Command-line flags override these; both are read once at startup.

# Graphics backend: vulkan | opengl
rhi = vulkan
vsync = off
# Off by default, as everywhere: validation layers cost real performance and
# a player has no use for them. See the editor's ragev.ini for the numbers.
validation = off

frames-in-flight = 2

# The project to run. Left blank, the runtime looks for a .rvproject beside
# the executable -- which is the shape packaging produces.
# project =
