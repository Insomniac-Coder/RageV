# RageV engine configuration.
# Command-line flags override these; both are read once at startup.
# Switching the backend requires restarting the engine.

# Graphics backend: vulkan | opengl
rhi = vulkan
vsync = off
# Build Game: open the finished build in the file manager when it succeeds.
# The dialog's checkbox writes this, so ticking it once is enough.
reveal-after-build = off

# Vulkan validation layers: off by default, everywhere. Turn on to debug GPU
# work -- wrong barriers, bad descriptors, use-after-free on the GPU -- and
# turn back off when done. Requires the LunarG Vulkan SDK; without it the
# engine logs a warning and carries on.
#
# They cost real frame time: ~1.5 ms/frame of CPU, measured, which more than
# doubles an editor frame and only taxes Vulkan -- OpenGL has no equivalent
# layer. Leaving them on is how Vulkan gets called slower than OpenGL when it
# is measurably faster. The benchmark banner prints the validation state so a
# skewed measurement identifies itself.
validation = off

# 1-3. Higher trades latency for throughput.
frames-in-flight = 2
