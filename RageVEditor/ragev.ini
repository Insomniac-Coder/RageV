# RageV engine configuration.
# Command-line flags override these; both are read once at startup.
# Switching the backend requires restarting the engine.

# Graphics backend: vulkan | opengl
rhi = opengl

vsync = on

# Vulkan validation layers. Requires the LunarG Vulkan SDK to be installed;
# without it the engine logs a warning and carries on.
#
# They cost real frame time -- measured at ~1.5 ms/frame of CPU, which more
# than doubles an editor frame -- and only Vulkan pays it, OpenGL having no
# equivalent. Set this off before comparing the backends or profiling
# anything, or Vulkan will look slower than OpenGL when it is measurably
# faster. The benchmark banner prints the validation state for this reason.
validation = on

# 1-3. Higher trades latency for throughput.
frames-in-flight = 2
