# RageV engine configuration.
# Command-line flags override these; both are read once at startup.
# Switching the backend requires restarting the engine.

# Graphics backend: vulkan | opengl
rhi = opengl

vsync = on

# Vulkan validation layers. Requires the LunarG Vulkan SDK to be installed;
# without it the engine logs a warning and carries on.
validation = on

# 1-3. Higher trades latency for throughput.
frames-in-flight = 2
